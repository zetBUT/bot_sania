<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background: var(--tg-theme-bg-color); color: var(--tg-theme-text-color); padding: 20px; }
        input, select, button { width: 100%; padding: 10px; margin: 10px 0; border-radius: 8px; border: 1px solid #ccc; }
        button { background: var(--tg-theme-button-color); color: var(--tg-theme-button-text-color); font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <h3>Додати транзакцію 💸</h3>
    <select id="type">
        <option value="income">Дохід 🟢</option>
        <option value="expense">Витрата 🔴</option>
    </select>
    <input type="text" id="category" placeholder="Категорія (напр. Продукти)">
    <input type="number" id="amount" placeholder="Сума">
    <button id="send">Зберегти</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); // Розгорнути на весь екран

        document.getElementById('send').onclick = function() {
            let data = {
                type: document.getElementById('type').value,
                category: document.getElementById('category').value,
                amount: document.getElementById('amount').value
            };
            tg.sendData(JSON.stringify(data)); // Відправка даних боту
            tg.close(); // Закрити вікно
        };
    </script>
</body>
</html>
