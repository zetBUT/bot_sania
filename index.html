<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Фінанси Міні</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #1e1e2f;
      color: #fff;
      margin: 0;
      padding: 15px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #2a2a3d;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.5);
    }
    h1 { text-align: center; margin: 0 0 20px 0; }
    input, select, button {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 8px;
      border: none;
      font-size: 16px;
    }
    input, select { background: #3a3a52; color: white; }
    button {
      background: #4c6ef5;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:active { background: #3b5bd8; }
    .history { margin-top: 20px; }
    .item {
      background: #3a3a52;
      padding: 10px;
      margin: 8px 0;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
    }
    .expense { color: #ff6b6b; }
    .income { color: #51cf66; }
    .summary {
      font-size: 18px;
      text-align: center;
      padding: 15px;
      background: #3a3a52;
      border-radius: 8px;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>💰 Фінанси Міні</h1>

    <div class="summary" id="summary">
      Баланс: 0 грн
    </div>

    <input type="number" id="amount" placeholder="Сума" step="0.01">
    <select id="type">
      <option value="expense">Витрата</option>
      <option value="income">Дохід</option>
    </select>
    <input type="text" id="category" placeholder="Категорія (їжа, транспорт...)">
    <input type="text" id="desc" placeholder="Опис (необов'язково)">

    <button onclick="addRecord()">➕ Додати запис</button>

    <div class="history">
      <h2>Історія</h2>
      <div id="history"></div>
    </div>

    <button onclick="clearAll()" style="background:#e74c3c; margin-top:15px;">Очистити все</button>
  </div>

  <script>
    let records = JSON.parse(localStorage.getItem('miniFinance')) || [];

    function saveData() {
      localStorage.setItem('miniFinance', JSON.stringify(records));
    }

    function addRecord() {
      const amount = parseFloat(document.getElementById('amount').value);
      if (!amount) return alert("Введи суму!");

      const type = document.getElementById('type').value;
      const category = document.getElementById('category').value || "Інше";
      const desc = document.getElementById('desc').value;

      records.push({
        date: new Date().toLocaleDateString('uk-UA'),
        type: type,
        amount: amount,
        category: category,
        desc: desc
      });

      saveData();
      updateUI();
      
      // очищення полів
      document.getElementById('amount').value = '';
      document.getElementById('category').value = '';
      document.getElementById('desc').value = '';
    }

    function updateUI() {
      let balance = 0;
      let html = '';

      records.forEach((r, i) => {
        const sign = r.type === 'income' ? '+' : '-';
        const color = r.type === 'income' ? 'income' : 'expense';
        balance += r.type === 'income' ? r.amount : -r.amount;

        html += `
          <div class="item">
            <div>
              <b>${r.date}</b> — ${r.category}<br>
              <small>${r.desc}</small>
            </div>
            <div class="${color}"><b>${sign}${r.amount}</b></div>
          </div>`;
      });

      document.getElementById('history').innerHTML = html || '<p style="color:#777">Поки немає записів</p>';
      document.getElementById('summary').innerHTML = `Баланс: <b>${balance.toFixed(0)} грн</b>`;
    }

    function clearAll() {
      if (confirm("Точно очистити всі дані?")) {
        records = [];
        saveData();
        updateUI();
      }
    }

    // Запуск
    updateUI();
  </script>
</body>
</html>
