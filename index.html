<script>

Telegram.WebApp.ready()

let transactions = JSON.parse(
    localStorage.getItem("transactions")
) || []

function sendReport(){

    let income = 0
    let expense = 0

    transactions.forEach(item=>{

        if(item.type==="income"){
            income += item.amount
        }
        else{
            expense += item.amount
        }

    })

    let balance = income - expense

    let report =

`💰 Доходи: ${income} грн
💸 Витрати: ${expense} грн
🟢 Баланс: ${balance} грн`

    Telegram.WebApp.sendData(report)
}

</script>
