```html
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Finance App</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0f0f0f;
    color:white;
    font-family:Arial;
    padding:15px;
}

.container{
    max-width:500px;
    margin:auto;
}

.title{
    text-align:center;
    margin-bottom:20px;
}

.stats{
    display:grid;
    gap:10px;
    margin-bottom:20px;
}

.card{
    background:#1c1c1c;
    padding:15px;
    border-radius:15px;
}

.green{
    border-left:5px solid #00e676;
}

.red{
    border-left:5px solid #ff5252;
}

.blue{
    border-left:5px solid #00b0ff;
}

input,
select,
button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    margin-top:10px;
    font-size:16px;
}

input,
select{
    background:#2a2a2a;
    color:white;
}

button{
    background:#0088cc;
    color:white;
    font-weight:bold;
}

.history{
    margin-top:20px;
}

.item{
    background:#1d1d1d;
    padding:15px;
    border-radius:15px;
    margin-bottom:10px;
}

.top{
    display:flex;
    justify-content:space-between;
    margin-bottom:8px;
}

.plus{
    color:#00e676;
}

.minus{
    color:#ff5252;
}

.report{
    background:#7c4dff;
}

.clear{
    background:#ff1744;
}

</style>

</head>
<body>

<div class="container">

    <h1 class="title">💰 Finance App</h1>

    <div class="stats">

        <div class="card green">
            <h3>Доходи</h3>
            <h2 id="income">0 грн</h2>
        </div>

        <div class="card red">
            <h3>Витрати</h3>
            <h2 id="expense">0 грн</h2>
        </div>

        <div class="card blue">
            <h3>Баланс</h3>
            <h2 id="balance">0 грн</h2>
        </div>

    </div>

    <select id="type">
        <option value="income">Доходи</option>
        <option value="expense">Витрати</option>
    </select>

    <input type="text" id="category" placeholder="Категорія">

    <input type="number" id="amount" placeholder="Сума">

    <button onclick="addTransaction()">
        Додати
    </button>

    <button class="report" onclick="monthlyReport()">
        📊 Місячний звіт
    </button>

    <button class="clear" onclick="clearAll()">
        🗑 Очистити
    </button>

    <div class="history" id="history"></div>

</div>

<script>

Telegram.WebApp.ready()

let transactions = JSON.parse(localStorage.getItem("transactions")) || []

updateUI()

function addTransaction(){

    let type = document.getElementById("type").value
    let category = document.getElementById("category").value
    let amount = document.getElementById("amount").value

    if(category === "" || amount === ""){
        alert("Заповни поля")
        return
    }

    transactions.push({
        type:type,
        category:category,
        amount:Number(amount),
        date:new Date().toLocaleDateString()
    })

    localStorage.setItem(
        "transactions",
        JSON.stringify(transactions)
    )

    document.getElementById("category").value = ""
    document.getElementById("amount").value = ""

    updateUI()
}

function updateUI(){

    let income = 0
    let expense = 0

    transactions.forEach(item=>{

        if(item.type==="income"){
            income += item.amount
        }else{
            expense += item.amount
        }

    })

    let balance = income - expense

    document.getElementById("income").innerText =
        income + " грн"

    document.getElementById("expense").innerText =
        expense + " грн"

    document.getElementById("balance").innerText =
        balance + " грн"

    let history = ""

    transactions.slice().reverse().forEach(item=>{

        history += `
        
        <div class="item">

            <div class="top">

                <strong>${item.category}</strong>

                <strong class="${
                    item.type==="income"
                    ? "plus"
                    : "minus"
                }">

                ${
                    item.type==="income"
                    ? "+"
                    : "-"
                }

                ${item.amount} грн

                </strong>

            </div>

            <div>
                ${item.date}
            </div>

        </div>

        `
    })

    document.getElementById("history").innerHTML =
        history
}

function monthlyReport(){

    let income = 0
    let expense = 0

    transactions.forEach(item=>{

        if(item.type==="income"){
            income += item.amount
        }else{
            expense += item.amount
        }

    })

    let balance = income - expense

    alert(

`📊 Місячний звіт

💰 Доходи: ${income} грн
💸 Витрати: ${expense} грн
🟢 Баланс: ${balance} грн`

    )
}

function clearAll(){

    transactions = []

    localStorage.removeItem("transactions")

    updateUI()
}

</script>

</body>
</html>
```
