<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Фінанси Міні</title>
  <style>
    body {font-family: Arial, sans-serif; background: #1e1e2f; color: #fff; margin:0; padding:15px;}
    .container {max-width: 600px; margin: 0 auto; background: #2a2a3d; border-radius: 12px; padding: 20px; box-shadow: 0 5px 20px rgba(0,0,0,0.5);}
    h1 {text-align:center;}
    input, select, button {
      width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: none; font-size: 16px;
    }
    input, select {background: #3a3a52; color: white;}
    button {background: #4c6ef5; color: white; font-weight: bold; cursor: pointer;}
    button:active {background: #3b5bd8;}
    .send-btn {background: #51cf66; margin: 15px 0;}
    .send-btn:disabled {background: #666; cursor: not-allowed;}
    .item {background: #3a3a52; padding: 10px; margin: 8px 0; border-radius: 8px; display: flex; justify-content: space-between;}
    .expense {color: #ff6b6b;}
    .income {color: #51cf66;}
    .summary {font-size: 18px; text-align: center; padding: 15px; background: #3a3a52; border-radius: 8px; margin-bottom: 15px;}
  </style>
</head>
<body>
  <div class="container">
    <h1>💰 Фінанси Міні</h1>

    <div class="summary" id="summary">Баланс: 0 грн</div>

    <input type="number" id="amount" placeholder="Сума" step="0.01">
    <select id="type">
      <option value="expense">Витрата</option>
      <option value="income">Дохід</option>
    </select>
    <input type="text" id="category" placeholder="Категорія">
    <input type="text" id="desc" placeholder="Опис (необов'язково)">

    <button onclick="addRecord()">➕ Додати запис</button>
    <button id="sendBtn" onclick="sendReport()" class="send-btn">📤 Відправити звіт в чат</button>

    <div class="history">
      <h2>Історія</h2>
      <div id="history"></div>
    </div>

    <button onclick="clearAll()" style="background:#e74c3c; margin-top:10px;">Очистити все</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.ready();

    let records = JSON.parse(localStorage.getItem('miniFinance')) || [];
    let isSending = false;

    function saveData() {
      localStorage.setItem('miniFinance', JSON.stringify(records));
    }

    function addRecord() {
      const amount = parseFloat(document.getElementById('amount').value);
      if (!amount || isNaN(amount)) return alert("Введіть правильну суму!");

      records.push({
        date: new Date().toLocaleDateString('uk-UA'),
        type: document.getElementById('type').value,
        amount: amount,
        category: document.getElementById('category').value.trim() || "Інше",
        desc: document.getElementById('desc').value.trim() || ""
      });

      saveData();
      updateUI();
      
      document.getElementById('amount').value = '';
      document.getElementById('category').value = '';
      document.getElementById('desc').value = '';
    }

    function updateUI() {
      let balance = 0;
      let html = '';

      records.forEach(r => {
        const sign = r.type === 'income' ? '+' : '-';
        balance += r.type === 'income' ? r.amount : -r.amount;
        html += `
          <div class="item">
            <div><b>${r.date}</b> — ${r.category}<br><small>${r.desc}</small></div>
            <div class="${r.type}"><b>${sign}${r.amount}</b></div>
          </div>`;
      });

      document.getElementById('history').innerHTML = html || '<p style="color:#777">Поки немає записів</p>';
      document.getElementById('summary').innerHTML = `Баланс: <b>${balance.toFixed(0)} грн</b>`;
    }

    function sendReport() {
      if (records.length === 0) {
        alert("❌ Немає записів! Додайте хоча б одну операцію.");
        return;
      }
      if (isSending) return;

      isSending = true;
      const sendBtn = document.getElementById('sendBtn');
      sendBtn.disabled = true;
      sendBtn.textContent = "📤 Відправляємо...";

      let balance = 0;
      records.forEach(r => {
        balance += r.type === 'income' ? r.amount : -r.amount;
      });

      let text = `💰 Баланс: ${balance.toFixed(0)} грн\n`;
      text += `📊 Всього записів: ${records.length}\n\n`;
      text += `Останні операції:\n`;

      records.slice(-8).reverse().forEach(r => {
        const sign = r.type === 'income' ? '✅ +' : '❌ -';
        text += `${r.date} ${sign}${r.amount} — ${r.category}\n`;
      });

      // Надійно відправляємо
      try {
        tg.sendData(text);
        tg.showPopup({
          title: "✅ Успішно",
          message: "Звіт надіслано в чат"
        });
      } catch (e) {
        alert("Помилка відправки");
      }

      // Повертаємо кнопку через 2 секунди
      setTimeout(() => {
        isSending = false;
        sendBtn.disabled = false;
        sendBtn.textContent = "📤 Відправити звіт в чат";
      }, 2000);
    }

    function clearAll() {
      if (confirm("Точно очистити ВСІ дані?")) {
        records = [];
        saveData();
        updateUI();
      }
    }

    // Запуск
    updateUI();
  </script>
</body>
</html>
